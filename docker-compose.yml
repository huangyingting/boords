services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boords
      POSTGRES_PASSWORD: boords_password
      POSTGRES_DB: boords
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boords -d boords"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://boords:boords_password@postgres:5432/boords?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: production-secret-change-in-live-deployment-boords-2026
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
